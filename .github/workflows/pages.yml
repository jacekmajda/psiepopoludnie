name: Publikacja na GitHub Pages

# Strona to zwykłe pliki statyczne. Jedyny krok budowania to minifikacja
# `index.html` - w repozytorium plik zostaje czytelny (z wcięciami
# i komentarzami), a na serwer trafia wersja bez zbędnych znaków.
#
# Warunek: w Settings -> Pages -> Build and deployment trzeba raz
# ręcznie ustawić Source na "GitHub Actions". Token przepływu nie ma
# uprawnień administratora repozytorium, więc nie potrafi włączyć
# Pages samodzielnie.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jednocześnie publikujemy tylko jedną wersję; trwających wdrożeń nie przerywamy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zminifikuj index.html
        run: |
          cp index.html index.source.html
          # --conservative-collapse zwija ciągi białych znaków do jednej
          # spacji, ale nigdy nie kasuje jej całkiem - inaczej minifikator
          # potrafi skleić wyrazy rozdzielone znacznikiem (np. </strong> –).
          npx --yes html-minifier-terser@7.2.0 \
            --collapse-whitespace \
            --conservative-collapse \
            --remove-comments \
            --minify-css \
            --minify-js \
            --output index.html \
            index.source.html

      - name: Sprawdź, czy minifikacja niczego nie zepsuła
        run: |
          python3 check-html.py index.source.html index.html
          rm index.source.html

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4

name: Publikacja na GitHub Pages

# Strona to zwykłe pliki statyczne - nie ma kroku budowania.
# Ten przepływ publikuje zawartość repozytorium przy każdej zmianie
# na gałęzi main.
#
# Warunek: w Settings -> Pages -> Build and deployment trzeba raz
# ręcznie ustawić Source na "GitHub Actions". Token przepływu nie ma
# uprawnień administratora repozytorium, więc nie potrafi włączyć
# Pages samodzielnie.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jednocześnie publikujemy tylko jedną wersję; trwających wdrożeń nie przerywamy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
